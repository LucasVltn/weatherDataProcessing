version: '3.8'

services:

  postgres_kedro:
    image: postgres:15
    container_name: postgres_kedro
    environment:
      POSTGRES_USER: weather_user
      POSTGRES_PASSWORD: weather_pass
      POSTGRES_DB: weather_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_kedro_data:/var/lib/postgresql/data
      
  postgres_airflow:
    image: postgres:15
    container_name: postgres_airflow
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5433:5432"

  airflow:
      image: apache/airflow:2.8.1
      depends_on:
        - postgres_airflow
      env_file:
        - ./airflow_dags/.env
      volumes:
        - ./airflow_dags/dags:/opt/airflow/dags
        - ./airflow_dags/logs:/opt/airflow/logs
        - ./airflow_dags/plugins:/opt/airflow/plugins
        - /var/run/docker.sock:/var/run/docker.sock
      ports:
        - "8080:8080"
      command: >
        bash -c "airflow db init && airflow users create --username admin --firstname Admin --lastname User --role Admin --email admin@example.com --password admin && airflow scheduler & airflow webserver"


  kedro:
    build:
      context: ./kedroweather
    image: kedro-weather-app:latest
    depends_on:
      - postgres_kedro
    env_file:
      - ./kedroweather/.env
    tty: true
    stdin_open: true
volumes:
  postgres_kedro_data: