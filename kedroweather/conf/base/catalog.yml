  filepath: data/01_raw/city_weather_info.json


readable_city_weather_data:
  type: partitions.PartitionedDataset
  path: data/02_intermediate/events/
  dataset:
    type: pandas.CSVDataset
    save_args:
      sep: ";"
      index: False
    load_args:
      sep: ";"